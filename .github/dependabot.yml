version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group routine updates and hold back major bumps that break peer dependencies
    # (e.g. TypeScript majors before typescript-eslint supports them); review majors manually.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The types must describe the Node version the project runs on (see .nvmrc and engines).
      # A newer major describes APIs that the running Node does not have. Bump it together with .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
