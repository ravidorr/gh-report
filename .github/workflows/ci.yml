name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Posts the coverage table as a PR comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: scripts/check-release.mjs diffs against origin/<base>.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with 100% coverage gate
        run: npm run test:coverage
      # The <!-- coverage-report --> marker in the table is informational: `gh pr comment --edit-last` edits the
      # bot's last comment whatever it contains.
      - name: Coverage report (job summary and PR comment)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: |
          node scripts/coverage-summary.mjs > coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$CAN_COMMENT" = "true" ]; then
            gh pr comment "$PR_NUMBER" --body-file coverage-report.md --edit-last --create-if-none
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
      - run: npm run build
      - name: Dependency audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (dev tooling, informational)
        continue-on-error: true
        run: npm audit --audit-level=high
      # Only enforced when release-relevant files change: the paths built into scripts/check-release.mjs (package.json,
      # tsconfig.json, src/ and others) plus RELEASE_TRIGGER_PATHS below. Keep that list equal to .husky/pre-push.
      # Skipped for Dependabot: it updates package.json, the lockfile or action versions but never carries a version
      # bump or changelog entry. Checked three ways, because the actor is not always Dependabot: a person who clicks
      # "Update branch" or comments "@dependabot rebase" becomes the actor of the PR run (so the PR author is checked),
      # and the push to main after a squash merge is made by the person who merged (so the commit author is checked).
      - name: Version and changelog gate
        if: >-
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.head_commit.author.name != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          RELEASE_TRIGGER_PATHS: gh-repo-report.sh,site/,design-system/,scripts/build.mjs,scripts/verify-report.mjs,.github/workflows/report.yml
        run: node scripts/check-release.mjs

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Lighthouse needs data to render: use the synthetic sample, never real report output.
      - run: cp test/fixtures/data.json dist/data.json
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
